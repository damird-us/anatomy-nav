<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Анатомия: навигация</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
  // Свежие стили и код при каждом открытии (обходит кэш Telegram).
  (function () {
    var v = Date.now();
    document.write('<link rel="stylesheet" href="app.css?v=' + v + '">');
    window.__APP_JS__ = 'app.js?v=' + v;
  })();
</script>
</head>
<body>
<header>
  <h1>Анатомия 📚</h1>
  <div class="sub" id="sub">Загрузка…</div>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="text" enterkeyhint="search" placeholder="Поиск: печень, череп, вены…" autocomplete="off">
    <button class="clear" id="clear" aria-label="Очистить">×</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="list"></main>

<script>document.write('<script src="' + window.__APP_JS__ + '"><\/script>');</script>
</body>
</html>
