<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Анатомия: навигация</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f2f3f5);
    --text: var(--tg-theme-text-color, #111418);
    --hint: var(--tg-theme-hint-color, #8a9099);
    --accent: var(--tg-theme-button-color, #2f7cf6);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --section: var(--tg-theme-section-bg-color, var(--bg));
    --sep: color-mix(in srgb, var(--hint) 22%, transparent);
    --mark: color-mix(in srgb, var(--accent) 22%, transparent);
  }
  @media (prefers-color-scheme: dark) {
    :root:not(.tg) {
      --bg: #17191c; --bg2: #0f1113; --text: #eceef1; --hint: #7d848e;
      --accent: #5a9bff; --section: #1d2024;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg2); color: var(--text);
    font: 16px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding-bottom: env(safe-area-inset-bottom); }

  header { position: sticky; top: 0; z-index: 5; background: var(--bg2);
    padding: 14px 16px 10px; }
  h1 { font-size: 20px; margin: 0 0 2px; font-weight: 700; }
  .sub { color: var(--hint); font-size: 13px; margin-bottom: 12px; }

  .search { position: relative; }
  .search input { width: 100%; border: 0; outline: 0; border-radius: 12px;
    padding: 11px 38px 11px 38px; font-size: 16px; background: var(--section); color: var(--text); }
  .search input::placeholder { color: var(--hint); }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px; stroke: var(--hint); }
  .clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    border: 0; background: none; color: var(--hint); font-size: 20px; width: 30px; height: 30px;
    cursor: pointer; display: none; }

  .tabs { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; border: 0; border-radius: 999px; padding: 7px 13px; font-size: 14px;
    background: var(--section); color: var(--text); cursor: pointer; white-space: nowrap; }
  .tab.on { background: var(--accent); color: var(--accent-text); }
  .tab .n { opacity: .6; margin-left: 4px; font-size: 12px; }

  main { padding: 2px 16px 24px; }
  .sec-title { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
    color: var(--hint); margin: 18px 4px 8px; }
  .group { background: var(--section); border-radius: 14px; overflow: hidden; margin-bottom: 10px; }
  .group-h { display: flex; justify-content: space-between; align-items: center;
    padding: 11px 14px 9px; font-weight: 600; font-size: 15px; cursor: pointer; user-select: none; }
  .group-h .cnt { color: var(--hint); font-weight: 400; font-size: 13px; display: flex; gap: 6px; align-items: center; }
  .group-h .arr { transition: transform .2s; display: inline-block; }
  .group.closed .arr { transform: rotate(-90deg); }
  .group.closed .items { display: none; }

  .item { display: flex; align-items: center; gap: 12px; padding: 11px 14px; cursor: pointer;
    border-top: 1px solid var(--sep); text-decoration: none; color: inherit; }
  .item:active { background: var(--sep); }
  .ico { width: 34px; height: 34px; border-radius: 9px; flex: none; display: grid; place-items: center;
    font-size: 17px; background: color-mix(in srgb, var(--accent) 13%, transparent); }
  .ico.video { background: color-mix(in srgb, #e5484d 15%, transparent); }
  .t { flex: 1; min-width: 0; }
  .t .name { font-size: 15px; }
  .t .meta { font-size: 12px; color: var(--hint); margin-top: 1px; }
  .chev { color: var(--hint); flex: none; font-size: 18px; }
  mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }

  .empty { text-align: center; color: var(--hint); padding: 48px 20px; }
  .empty b { display: block; font-size: 32px; margin-bottom: 8px; }
</style>
</head>
<body>
<header>
  <h1>Анатомия 📚</h1>
  <div class="sub" id="sub">Загрузка…</div>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="text" enterkeyhint="search" placeholder="Поиск: печень, череп, вены…" autocomplete="off">
    <button class="clear" id="clear" aria-label="Очистить">×</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="list"></main>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg && tg.initData !== undefined) {
  document.documentElement.classList.add('tg');
  tg.ready(); tg.expand();
}
const haptic = () => { try { tg && tg.HapticFeedback.selectionChanged(); } catch (e) {} };
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};

let DATA, tab = store.get('tab') || 'all', query = '';
const closed = new Set(JSON.parse(store.get('closed') || '[]'));
const norm = s => s.toLowerCase().replace(/ё/g, 'е');
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function highlight(text) {
  if (!query) return esc(text);
  const i = norm(text).indexOf(norm(query));
  if (i < 0) return esc(text);
  return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + query.length)) + '</mark>' + esc(text.slice(i + query.length));
}

function openPost(id) {
  haptic();
  const url = `https://t.me/c/${DATA.channel}/${id}`;
  if (tg && tg.openTelegramLink && tg.initData) tg.openTelegramLink(url);
  else window.open(url, '_blank');
}

function itemHtml(id) {
  const p = DATA.posts[id];
  if (!p) return '';
  const video = p.type === 'video';
  return `<a class="item" data-id="${id}">
    <div class="ico ${video ? 'video' : ''}">${video ? '🎬' : '📊'}</div>
    <div class="t"><div class="name">${highlight(p.title)}</div>
      <div class="meta">${video ? 'Видео' : 'Презентация'}</div></div>
    <span class="chev">›</span></a>`;
}

function render() {
  const list = document.getElementById('list');
  const q = norm(query.trim());
  let html = '', found = 0;
  for (const s of DATA.sections) {
    if (!q && tab !== 'all' && tab !== s.id) continue;
    let secHtml = '';
    for (const g of s.groups) {
      const items = g.items.filter(id => DATA.posts[id] &&
        (!q || norm(DATA.posts[id].title).includes(q) || norm(g.title).includes(q)));
      if (!items.length) continue;
      found += items.length;
      const key = s.id + '/' + g.title;
      const isClosed = !q && closed.has(key);
      secHtml += `<div class="group ${isClosed ? 'closed' : ''}" data-key="${esc(key)}">
        <div class="group-h"><span>${highlight(g.title)}</span>
          <span class="cnt">${items.length} <span class="arr">▾</span></span></div>
        <div class="items">${items.map(itemHtml).join('')}</div></div>`;
    }
    if (secHtml) html += `<div class="sec-title">${s.icon} ${esc(s.title)}</div>` + secHtml;
  }
  list.innerHTML = html || `<div class="empty"><b>🔍</b>Ничего не нашлось по запросу «${esc(query)}»</div>`;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', !q && t.dataset.id === tab));
}

function renderTabs() {
  const count = s => s.groups.reduce((n, g) => n + g.items.filter(id => DATA.posts[id]).length, 0);
  const total = DATA.sections.reduce((n, s) => n + count(s), 0);
  const tabs = [{ id: 'all', short: 'Все', n: total }, ...DATA.sections.map(s => ({ id: s.id, short: s.icon + ' ' + s.short, n: count(s) }))];
  document.getElementById('tabs').innerHTML = tabs.map(t =>
    `<button class="tab" data-id="${t.id}">${esc(t.short)}<span class="n">${t.n}</span></button>`).join('');
  const posts = Object.values(DATA.posts);
  const v = posts.filter(p => p.type === 'video').length;
  document.getElementById('sub').textContent =
    `${posts.length - v} презентаций` + (v ? ` · ${v} видео` : '') + ' · нажмите, чтобы открыть пост';
}

document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (!b) return;
  haptic(); tab = b.dataset.id; store.set('tab', tab);
  query = ''; q.value = ''; clearBtn.style.display = 'none';
  render(); window.scrollTo(0, 0);
});
document.getElementById('list').addEventListener('click', e => {
  const it = e.target.closest('.item');
  if (it) return openPost(it.dataset.id);
  const h = e.target.closest('.group-h');
  if (h && !query) {
    const g = h.parentElement, key = g.dataset.key;
    g.classList.toggle('closed');
    g.classList.contains('closed') ? closed.add(key) : closed.delete(key);
    store.set('closed', JSON.stringify([...closed]));
  }
});
const q = document.getElementById('q'), clearBtn = document.getElementById('clear');
q.addEventListener('input', () => { query = q.value; clearBtn.style.display = query ? 'block' : 'none'; render(); });
clearBtn.addEventListener('click', () => { q.value = ''; query = ''; clearBtn.style.display = 'none'; render(); q.focus(); });

fetch('data.json?v=' + Date.now()).then(r => r.json()).then(d => {
  DATA = d;
  if (tab !== 'all' && !d.sections.some(s => s.id === tab)) tab = 'all';
  renderTabs(); render();
}).catch(() => {
  document.getElementById('list').innerHTML = '<div class="empty"><b>⚠️</b>Не удалось загрузить список. Попробуйте позже.</div>';
});
</script>
</body>
</html>
